<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>笔记抽屉 · 交互 Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f1ece1;
    --panel: #faf7ef;
    --ink: #38332a;
    --ink-soft: #6f6759;
    --muted: #a89f8d;
    --hairline: #e3dcc9;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--paper);
    font-family: 'Noto Serif SC', 'Songti SC', serif;
    color: var(--ink);
    overflow: hidden;
  }

  /* ---- 背后的编辑器（当前笔记） ---- */
  .editor-backdrop {
    position: fixed;
    inset: 0;
    padding: 12vh 420px 12vh 8vw;   /* 给右侧抽屉让位 */
    font-size: 30px;
    line-height: 2.2;
    color: #c9c1ae;
    user-select: none;
    pointer-events: none;
    transition: padding .38s cubic-bezier(.4,0,.2,1);
  }
  body.panel-hidden .editor-backdrop { padding-right: 8vw; }
  .editor-backdrop p { max-width: 24ch; }

  /* ---- 笔记面板：贴住应用右缘的抽屉 ---- */
  .panel {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: 360px;
    background: var(--panel);
    border-left: 1px solid var(--hairline);
    box-shadow: -12px 0 36px rgba(74, 62, 38, 0.05);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: transform .38s cubic-bezier(.4,0,.2,1);
  }
  body.panel-hidden .panel { transform: translateX(100%); }

  /* 收起/展开把手 */
  .panel-handle {
    position: fixed;
    top: 50%;
    right: 360px;               /* 骑在抽屉左缘 */
    transform: translate(50%, -50%);
    width: 22px;
    height: 60px;
    border-radius: 11px;
    background: var(--panel);
    border: 1px solid var(--hairline);
    box-shadow: 0 4px 14px rgba(74, 62, 38, 0.10);
    color: var(--muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
    transition: right .38s cubic-bezier(.4,0,.2,1), color .2s ease,
                height .2s ease, opacity .25s ease, transform .38s cubic-bezier(.4,0,.2,1);
  }
  /* 隐形的放大 hover 区域：上下左右各扩一圈，右缘更容易扫到 */
  .panel-handle::before {
    content: '';
    position: absolute;
    inset: -70px -16px;
  }
  .panel-handle:hover { color: var(--ink); height: 72px; }
  .panel-handle svg { transition: transform .3s ease; flex: none; }

  /* 折叠后：把手隐身，鼠标移入右缘才浮现 */
  body.panel-hidden .panel-handle {
    right: 0;
    transform: translate(8px, -50%);
    border-radius: 11px 0 0 11px;
    border-right: none;
    opacity: 0;
  }
  body.panel-hidden .panel-handle:hover {
    opacity: 1;
    transform: translate(0, -50%);
  }
  body.panel-hidden .panel-handle svg { transform: rotate(180deg); }

  /* 搜索框：常驻在面板顶部 */
  .search { padding: 20px 24px 4px; flex: none; }
  .search input {
    width: 100%;
    border: none;
    background: transparent;
    outline: none;
    font-family: 'Cormorant Garamond', 'Noto Serif SC', serif;
    font-size: 15px;
    color: var(--ink);
    padding: 6px 0;
  }
  .search input::placeholder { color: #c2b9a4; }

  /* 笔记列表 */
  .note-list {
    list-style: none;
    flex: 1;
    overflow-y: auto;
    padding: 8px 0 0;
  }
  .note-item {
    padding: 14px 24px 16px;
    border-bottom: 1px solid var(--hairline);
    cursor: pointer;
    animation: rise .35s ease backwards;
  }
  .note-item:hover { background: #f4efe3; }
  .note-item.current { background: #f2ecdd; }
  .note-title {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: .02em;
    margin-bottom: 5px;
  }
  .note-title .dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #b09a6a;
    margin-right: 7px;
    vertical-align: 2px;
  }
  .note-excerpt {
    font-size: 13px;
    line-height: 1.7;
    color: var(--ink-soft);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .note-date {
    margin-top: 7px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 12.5px;
    letter-spacing: .04em;
    color: var(--muted);
  }

  /* 全部笔记入口 */
  .all-entry {
    display: none;
    width: 100%;
    border: none;
    background: transparent;
    cursor: pointer;
    padding: 15px 24px 17px;
    text-align: left;
    font-family: 'Noto Serif SC', serif;
    font-size: 14px;
    color: var(--muted);
    border-top: 1px solid var(--hairline);
    transition: color .2s ease, background .2s ease;
    animation: rise .35s .1s ease backwards;
    flex: none;
  }
  .all-entry.visible { display: flex; align-items: baseline; }
  .all-entry:hover { color: var(--ink-soft); background: #f4efe3; }
  .all-entry .count {
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    margin-left: 6px;
    letter-spacing: .05em;
  }
  .all-entry .arrow {
    margin-left: auto;
    font-family: 'Cormorant Garamond', serif;
    transition: transform .2s ease;
  }
  .all-entry:hover .arrow { transform: translateX(3px); }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .empty-hint {
    padding: 40px 24px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }

  /* 演示控制条（不属于产品 UI） */
  .demo-bar {
    position: fixed;
    left: 24px;
    bottom: 24px;
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 13px;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .demo-bar .seg {
    border: 1px solid var(--hairline);
    border-radius: 6px;
    overflow: hidden;
    display: flex;
  }
  .demo-bar .seg button {
    border: none;
    background: transparent;
    padding: 5px 12px;
    font-family: inherit;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
  }
  .demo-bar .seg button.on { background: #e9e2cf; color: var(--ink); }
</style>
</head>
<body>

<div class="editor-backdrop">
  <p>九月的雨下得很慢，<br>像一封写了很久<br>还没有寄出的信。<br><br>这是秋天寄来的第一封信，<br>这是我在九月写下的一页。<br>窗外的梧桐把影子<br>一点一点收进屋里。</p>
</div>

<aside class="panel">
  <div class="search">
    <input type="text" placeholder="Search all notes..." id="searchInput">
  </div>
  <ul class="note-list" id="noteList"></ul>
  <button class="all-entry" id="allEntry">
    全部笔记<span class="count" id="allCount"></span><span class="arrow">→</span>
  </button>
</aside>

<button class="panel-handle" id="panelHandle" title="收起 / 展开笔记列表">
  <svg width="10" height="14" viewBox="0 0 10 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="3,2 8,7 3,12"/>
  </svg>
</button>

<div class="demo-bar">
  演示数据
  <span class="seg">
    <button id="btnFew">3 篇</button>
    <button id="btnMany" class="on">7 篇</button>
  </span>
  <span style="color:#c2b9a4">（超过 3 篇时出现「全部笔记」入口）</span>
</div>

<script>
const NOTES = [
  { title: '测试标题', excerpt: '测试标题 131233 阿松大外来 213123321，这是一个标题，这是…', date: '2026-09-02 17:28' },
  { title: '这是一个标题', excerpt: '这是一个标题，这是一个标题，加粗的 2312323。6月24日，天气晴天，这是要做的东西…', date: '2026-09-02 17:09' },
  { title: 'Welcome', excerpt: 'Welcome! This is a guide note, written entirely by this app. All notes are stored as plain Markdown files in your home di…', date: '2026-09-01 14:18' },
  { title: '九月的第一场雨', excerpt: '雨是从傍晚开始下的，先是落在遮雨棚上，后来才落到心里。想起去年这个时候…', date: '2026-08-30 09:12' },
  { title: '读书笔记：夜晚的潜水艇', excerpt: '「我一度拥有过那种才华，它像一艘潜水艇，在深夜的海里无声地航行。」摘三段…', date: '2026-08-27 22:40' },
  { title: '购物清单', excerpt: '牛奶、鸡蛋、吐司、咖啡豆（中烘）、洗衣液。周末记得去取干洗的大衣。', date: '2026-08-25 18:03' },
  { title: '一些碎片想法', excerpt: '1. 笔记软件的列表应该像书桌，常用的摊在手边；2. 搜索比文件夹重要；3. …', date: '2026-08-20 08:47' },
];

const RECENT_COUNT = 3;
let pool = NOTES.slice();
let expanded = false;
let keyword = '';
let currentId = 0;

const listEl = document.getElementById('noteList');
const entryEl = document.getElementById('allEntry');
const countEl = document.getElementById('allCount');

function renderList() {
  const filtered = pool.filter(n =>
    !keyword || (n.title + n.excerpt).toLowerCase().includes(keyword.toLowerCase())
  );
  const items = expanded ? filtered : filtered.slice(0, RECENT_COUNT);

  listEl.innerHTML = '';
  items.forEach((n, i) => {
    const li = document.createElement('li');
    li.className = 'note-item' + (pool.indexOf(n) === currentId ? ' current' : '');
    li.style.animationDelay = (i * 0.05) + 's';
    li.innerHTML = `
      <div class="note-title">${pool.indexOf(n) === currentId ? '<span class="dot"></span>' : ''}${n.title}</div>
      <div class="note-excerpt">${n.excerpt}</div>
      <div class="note-date">${n.date}</div>`;
    li.addEventListener('click', () => { currentId = pool.indexOf(n); renderList(); });
    listEl.appendChild(li);
  });
  if (!items.length) listEl.innerHTML = '<div class="empty-hint">没有匹配的笔记</div>';

  entryEl.classList.toggle('visible', !expanded && filtered.length > RECENT_COUNT);
  countEl.textContent = `(${filtered.length})`;
}

document.getElementById('searchInput').addEventListener('input', e => {
  keyword = e.target.value.trim();
  expanded = !!keyword;      // 搜索时直接在全量里过滤；清空回到最近 3 篇
  renderList();
});
entryEl.addEventListener('click', () => { expanded = true; renderList(); });

// 面板收起 / 展开
document.getElementById('panelHandle').addEventListener('click', () => {
  document.body.classList.toggle('panel-hidden');
});

// 演示数据
document.getElementById('btnFew').addEventListener('click', e => {
  pool = NOTES.slice(0, 3); expanded = false; setSeg(e.target); renderList();
});
document.getElementById('btnMany').addEventListener('click', e => {
  pool = NOTES.slice(); expanded = false; setSeg(e.target); renderList();
});
function setSeg(btn) {
  document.querySelectorAll('.demo-bar .seg button').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
}

renderList();
</script>
</body>
</html>
